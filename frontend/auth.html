<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - TaxAssist</title>
    <!-- Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #4f46e5 0%, #1e40af 100%);
            background-attachment: fixed;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 1rem;
        }
        .auth-container {
            background: rgba(255, 255, 255, 0.98);
            border-radius: 16px;
            padding: 2.5rem;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            max-width: 420px;
            width: 100%;
            animation: fadeIn 0.4s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .logo {
            font-weight: 700;
            font-size: 1.75rem;
            color: #4f46e5;
            text-align: center;
            margin-bottom: 0.25rem;
        }
        .tagline {
            color: #6b7280;
            text-align: center;
            margin-bottom: 1.75rem;
            font-size: 0.95rem;
        }
        .input-field {
            background: #f9fafb;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            padding: 0.875rem 1rem;
            width: 100%;
            color: #111827;
            transition: all 0.2s ease;
            margin-bottom: 1rem;
            font-size: 0.95rem;
        }
        .input-field:focus {
            outline: none;
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.2);
            background: #ffffff;
        }
        .btn-primary {
            background: linear-gradient(90deg, #4f46e5, #4338ca);
            color: #ffffff;
            font-weight: 600;
            padding: 0.875rem 1.5rem;
            border-radius: 8px;
            border: none;
            width: 100%;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 0.5rem;
            font-size: 0.95rem;
        }
        .btn-primary:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25);
        }
        .btn-primary:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }
        .divider {
            display: flex;
            align-items: center;
            margin: 1.5rem 0;
            color: #9ca3af;
            font-size: 0.875rem;
        }
        .divider::before, .divider::after {
            content: "";
            flex: 1;
            border-bottom: 1px solid #e5e7eb;
        }
        .divider::before { margin-right: 1rem; }
        .divider::after { margin-left: 1rem; }
        .g_id_signin {
            display: flex;
            justify-content: center;
            margin-top: 0.75rem;
        }
        .back-link {
            color: #4f46e5;
            text-align: center;
            display: block;
            margin-top: 1.25rem;
            font-size: 0.875rem;
            cursor: pointer;
            text-decoration: none;
        }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="logo">TaxAssist</div>
        <div class="tagline">Intelligent Indian Tax Advisory</div>
        
        <div id="initialView">
            <h2 class="text-xl font-semibold text-gray-800 text-center mb-6">Sign in to your account</h2>
            
            <!-- Google Sign-In Container (Replace client_id with your Google OAuth Client ID) -->
            <div id="g_id_onload"
                 data-client_id="YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com"
                 data-context="signin"
                 data-ux_mode="popup"
                 data-callback="onSignIn"
                 data-auto_prompt="false">
            </div>
            
            <div class="g_id_signin"
                 data-type="standard"
                 data-shape="rectangular"
                 data-theme="filled_blue"
                 data-text="signin_with"
                 data-size="large"
                 data-logo_alignment="left"
                 data-width="340">
            </div>
            
            <div class="divider">or continue with email</div>
            
            <form onsubmit="handleEmailSignIn(event)">
                <input type="email" id="emailInput" class="input-field" placeholder="Email address" required>
                <input type="password" class="input-field" placeholder="Password" required>
                <button type="submit" class="btn-primary">Sign in with Email</button>
            </form>
            
            <div class="text-center text-sm text-gray-600 mt-4">
                Don't have an account? <a href="#" onclick="alert('Google Sign-In is recommended for instant setup.')" class="text-indigo-600 hover:underline">Sign up</a>
            </div>
        </div>
    </div>

    <script>
        function onSignIn(response) {
            console.log('Google Auth credential received.');
            fetch('/api/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                credentials: 'include',
                body: JSON.stringify({ credential: response.credential })
            })
            .then(res => {
                if (!res.ok) throw new Error('Login failed with status ' + res.status);
                return res.json();
            })
            .then(data => {
                console.log('Login successful:', data);
                if (data.user) {
                    localStorage.setItem('user', JSON.stringify({ user: data.user }));
                }
                showMobileVerificationUI();
            })
            .catch(err => {
                console.error('Sign-in error:', err);
                alert('Sign-in error. If running locally without Google Cloud OAuth credentials, you can use Email sign-in for demo.');
            });
        }

        function handleEmailSignIn(e) {
            e.preventDefault();
            const email = document.getElementById('emailInput').value;
            // Demo credentials for local review
            const mockToken = btoa(JSON.stringify({
                sub: 'demo_user_' + Date.now(),
                email: email,
                name: email.split('@')[0],
                picture: 'https://ui-avatars.com/api/?name=' + encodeURIComponent(email) + '&background=6366f1&color=fff'
            }));
            const fakeJwt = 'header.' + mockToken + '.signature';

            fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                credentials: 'include',
                body: JSON.stringify({ credential: fakeJwt })
            })
            .then(res => res.json())
            .then(data => {
                localStorage.setItem('user', JSON.stringify({ user: data.user }));
                showMobileVerificationUI();
            })
            .catch(err => console.error(err));
        }

        function showMobileVerificationUI() {
            const authContainer = document.querySelector('.auth-container');
            authContainer.innerHTML = `
                <div class="logo">TaxAssist</div>
                <div class="tagline">Account Verification</div>
                
                <div id="verificationView">
                    <h2 class="text-lg font-semibold text-gray-800 text-center mb-2">Verify Mobile Number</h2>
                    <p class="text-sm text-gray-500 text-center mb-4">A 4-digit security code will be sent to your phone</p>
                    
                    <input type="tel" id="mobileInput" class="input-field" placeholder="10-digit mobile number" maxlength="10" />
                    <button id="sendOtpBtn" class="btn-primary">Send Code</button>
                    
                    <div id="otpSection" class="hidden mt-4">
                        <p class="text-sm text-gray-500 text-center mb-2">Enter the verification code (try: 1234)</p>
                        <input type="text" id="otpInput" maxlength="4" class="input-field text-center tracking-widest text-lg" placeholder="____" />
                        <button id="verifyOtpBtn" class="btn-primary">Verify & Continue</button>
                    </div>
                    
                    <a id="backToSignIn" class="back-link">Back to sign in</a>
                </div>
            `;

            document.getElementById('sendOtpBtn').onclick = function() {
                const mobile = document.getElementById('mobileInput').value;
                if (!/^\d{10}$/.test(mobile)) {
                    alert('Please enter a valid 10-digit mobile number.');
                    return;
                }
                this.disabled = true;
                this.textContent = 'Sending...';
                setTimeout(() => {
                    document.getElementById('otpSection').classList.remove('hidden');
                    this.textContent = 'Code Sent';
                    document.getElementById('mobileInput').disabled = true;
                }, 800);
            };

            document.getElementById('verifyOtpBtn').onclick = function() {
                const otp = document.getElementById('otpInput').value;
                if (!/^\d{4}$/.test(otp)) {
                    alert('Please enter a valid 4-digit code.');
                    return;
                }
                this.disabled = true;
                this.textContent = 'Verifying...';
                setTimeout(() => {
                    window.location.replace('/main.html');
                }, 800);
            };

            document.getElementById('backToSignIn').onclick = function() {
                window.location.reload();
            };
        }
    </script>
</body>
</html>
